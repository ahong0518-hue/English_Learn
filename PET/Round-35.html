  study:  '📖 全部展開,第一次學:看+聽+跟讀 3 次',
  en2zh:  '🇬🇧→🇹🇼 看英文想中文,點卡片翻面驗證',
  zh2en:  '🇹🇼→🇬🇧 看中文拼英文,拼錯不擦,看差在哪',
  listen: '🔊 只聽發音打字,最強記憶模式(聽+寫+視覺三合一)'
};

let currentMode = 'study';
let answered = {};
let flags = JSON.parse(localStorage.getItem('pet-r35-flags') || '{}');
let modeOrder = { study: null, en2zh: null, zh2en: null, listen: null };
let modeIdx = { study: 0, en2zh: 0, zh2en: 0, listen: 0 };

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function ensureOrder(mode) {
  if (!modeOrder[mode]) {
    const seq = words.map((_, i) => i);
    modeOrder[mode] = (mode === 'study') ? seq : shuffle(seq);
  }
  return modeOrder[mode];
}

function reshuffle(mode) {
  const seq = words.map((_, i) => i);
  modeOrder[mode] = shuffle(seq);
  modeIdx[mode] = 0;
}

function getOrder() { return ensureOrder(currentMode); }

function saveFlags() { localStorage.setItem('pet-r35-flags', JSON.stringify(flags)); }
function setFlag(i, on) {
  if (on) flags[i] = true; else delete flags[i];
  saveFlags();
  const card = document.getElementById(`card-${i}`);
  if (!card) return;
  card.classList.toggle('flagged', !!flags[i]);
  const btn = card.querySelector('.flag-btn');
  if (btn) {
    btn.classList.toggle('flagged', !!flags[i]);
    btn.textContent = flags[i] ? '⭐' : '☆';
  }
  updateFlagCount();
}
function toggleFlag(i) { setFlag(i, !flags[i]); }
function updateFlagCount() {
  const el = document.getElementById('flagCount');
  if (el) el.textContent = Object.keys(flags).length;
}

function ttsUrl(w) {
  return `https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=${encodeURIComponent(w)}`;
}

let _voice = null;
function _getVoice() {
  if (_voice) return _voice;
  const vs = window.speechSynthesis.getVoices();
  _voice = vs.find(v => /^en-US$/i.test(v.lang) && /Siri/i.test(v.name))
        || vs.find(v => /^en-US$/i.test(v.lang) && /(Samantha|Nicky|Ava|Alex)/i.test(v.name))
        || vs.find(v => /^en-US$/i.test(v.lang))
        || vs.find(v => /^en/i.test(v.lang));
  return _voice;
}
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = () => { _voice = null; };
}

let currentAudio = null;
let lastAudioTime = 0;
function playAudio(word) {
  const now = Date.now();
  if (now - lastAudioTime < 250) return;
  lastAudioTime = now;
  if (currentAudio) {
    try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(e) {}
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.85;
    const v = _getVoice();
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } else {
    currentAudio = new Audio(ttsUrl(word));
    currentAudio.play().catch(() => {});
  }
}

function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  document.getElementById('modeHint').textContent = HINTS[currentMode];
  document.getElementById('statTotal').textContent = words.length;
  renderToolbar();

  words.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = `card ${w.type}`;
    card.id = `card-${i}`;
    if (i === currentIdx) card.classList.add('active', 'expanded');
    if (flags[i]) card.classList.add('flagged');
    card.innerHTML = `<button class="flag-btn ${flags[i]?'flagged':''}" onclick="event.stopPropagation();toggleFlag(${i})" title="標記疑難字">${flags[i]?'⭐':'☆'}</button>` + renderCardContent(w, i);
    container.appendChild(card);
  });
  updateProgress();
  updateFloatNav();
}

function renderToolbar() {
  const tb = document.getElementById('toolbar');
  const cont = document.getElementById('cards');
  const filterOn = cont.classList.contains('filter-flagged');
  const isQuiz = currentMode !== 'study';
  tb.innerHTML = `
    <button class="tool-btn" onclick="toggleAllView()">📖 全部展開 / 單張</button>
    <button class="tool-btn ${filterOn?'on':''}" id="filterBtn" onclick="toggleFilter()">🚩 只看疑難 (<span id="flagCount">0</span>)</button>
    ${isQuiz ? `<button class="tool-btn" onclick="reshuffleNow()">🔀 重新洗牌</button>` : ''}
    <span class="tool-info">← → 切換</span>
  `;
  updateFlagCount();
}

function reshuffleNow() {
  reshuffle(currentMode);
  currentIdx = modeOrder[currentMode][0];
  renderCards();
}

function toggleFilter() {
  const cont = document.getElementById('cards');
  const willTurnOn = !cont.classList.contains('filter-flagged');
  const btn = document.getElementById('filterBtn');

  if (willTurnOn) {
    const flagged = Object.keys(flags).map(Number).sort((a,b)=>a-b);
    if (flagged.length === 0) {
      alert('目前沒有疑難字。答錯或按 ⭐ 標記後,可以只看疑難複習。');
      return;
    }
    cont.classList.add('filter-flagged');
    btn.classList.add('on');
    if (!flags[currentIdx]) goToCard(flagged[0]);
    else updateFloatNav();
  } else {
    cont.classList.remove('filter-flagged');
    btn.classList.remove('on');
    updateFloatNav();
  }
}

function toggleAllView() {
  const cont = document.getElementById('cards');
  cont.classList.toggle('single-view');
  if (cont.classList.contains('single-view')) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('expanded'));
    const cur = document.getElementById(`card-${currentIdx}`);
    if (cur) cur.classList.add('expanded', 'active');
  } else {
    document.querySelectorAll('.card').forEach(c => c.classList.add('expanded'));
  }
  updateFloatNav();
}

let currentIdx = 0;

function toggleCard(i) {
  const card = document.getElementById(`card-${i}`);
  card.classList.toggle('expanded');
  if (card.classList.contains('expanded')) {
    currentIdx = i;
    updateFloatNav();
    playAudio(words[i].word);
  }
}

function scrollToCard(i) {
  const card = document.getElementById(`card-${i}`);
  if (!card) return;
  const headerH = document.querySelector('header').offsetHeight;
  const y = card.getBoundingClientRect().top + window.pageYOffset - headerH - 16;
  window.scrollTo({top: y, behavior: 'smooth'});
}

function goToCard(i) {
  if (i < 0 || i >= words.length) return;
  const cur = document.getElementById(`card-${currentIdx}`);
  const next = document.getElementById(`card-${i}`);

  const bodies = document.querySelectorAll('.card-body');
  bodies.forEach(b => b.style.transition = 'none');

  if (cur) { cur.classList.remove('expanded', 'active'); }
  next.classList.add('expanded', 'active');

  void next.offsetHeight;

  window.scrollTo({top: 0, behavior: 'smooth'});

  setTimeout(() => bodies.forEach(b => b.style.transition = ''), 60);

  currentIdx = i;
  modeIdx[currentMode] = getOrder().indexOf(i);
  updateFloatNav();
  if (currentMode !== 'zh2en') playAudio(words[i].word);

  const input = next.querySelector('input.quiz-input');
  if (input) setTimeout(() => input.focus(), 200);
}

function visibleIndices() {
  const cont = document.getElementById('cards');
  const filterOn = cont.classList.contains('filter-flagged');
  const order = getOrder();
  return order.filter(i => !filterOn || flags[i]);
}

function goPrev() {
  const v = visibleIndices();
  const pos = v.indexOf(currentIdx);
  if (pos > 0) goToCard(v[pos - 1]);
  else if (pos === -1 && v.length) goToCard(v[v.length - 1]);
}

function goNext() {
  const v = visibleIndices();
  const pos = v.indexOf(currentIdx);
  if (pos >= 0 && pos < v.length - 1) goToCard(v[pos + 1]);
  else if (pos === -1 && v.length) goToCard(v[0]);
}

function updateFloatNav() {
  const nav = document.getElementById('floatNav');
  const cont = document.getElementById('cards');
  const singleView = cont.classList.contains('single-view');
  if (!singleView) { nav.classList.add('hidden'); return; }
  nav.classList.remove('hidden');
  const v = visibleIndices();
  const pos = v.indexOf(currentIdx);
  const displayPos = pos >= 0 ? pos + 1 : 0;
  document.getElementById('navPos').textContent = `${displayPos} / ${v.length}`;
  document.getElementById('prevBtn').disabled = (pos <= 0);
  const nextBtn = document.getElementById('nextBtn');
  const atLast = (pos === v.length - 1);
  nextBtn.disabled = atLast;
  if (atLast) {
    nextBtn.classList.add('done');
    nextBtn.textContent = '✓';
  } else {
    nextBtn.classList.remove('done');
    nextBtn.textContent = '→';
  }
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
});

function fmtCollocation(s) {
  // Split after a Chinese/non-ASCII char before an English word start
  const parts = s.split(/(?<=[^\x00-\x7f])\s+(?=[a-zA-Z\(（])/);
  if (parts.length <= 1) return s;
  return parts.join(' <span class="coll-sep">·</span> ');
}

function renderCardContent(w, i) {
  const num = `<div class="card-number">${i+1}</div>`;
  const audioBtn = `<button class="speak" onclick="event.stopPropagation();playAudio('${w.word}')">🔊</button>`;
  const bigAudioBtn = `<button class="speak big" onclick="playAudio('${w.word}')">🔊</button>`;

  const fullInfo = `
    <div class="pos">${w.pos} ${w.meaning}</div>
    ${w.exOrig ? `<div class="row orig"><span class="label">例句</span>${w.exOrig}<br><span class="cn">${w.exOrigZh}</span></div>` : ''}
    ${w.exOrig2 ? `<div class="row orig"><span class="label">另義</span>${w.exOrig2}<br><span class="cn">${w.exOrig2Zh}</span></div>` : ''}
    ${w.antonym ? `<div class="row confuse-row"><span class="label">反義</span>${w.antonym}</div>` : ''}
    ${w.collocation ? `<div class="row match"><span class="label">搭配</span>${fmtCollocation(w.collocation)}</div>` : ''}
    ${w.family ? `<div class="row family-row"><span class="label">字族</span>${w.family}</div>` : ''}
    ${w.contrast ? `<div class="row confuse-row"><span class="label">對比</span>${w.contrast}</div>` : ''}
    <div class="tags">${w.tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>
  `;

  if (currentMode === 'study') {
    return `
      <div class="card-header" onclick="toggleCard(${i})">
        ${num}
        <div class="word-head"><span class="word">${w.word}</span><span class="kk">${w.kk}</span>${audioBtn}</div>
        <span class="expand-icon">▼</span>
      </div>
      <div class="card-body"><div class="card-body-inner">
        ${fullInfo}
      </div></div>
    `;
  }

  if (currentMode === 'en2zh') {
    return `
      <div class="clickable" onclick="flipCard(${i})">
        <div style="display:flex;align-items:center">
          ${num}
          <div class="word-head" style="flex:1"><span class="word">${w.word}</span><span class="kk">${w.kk}</span>${audioBtn}</div>
        </div>
        <div id="back-${i}" class="card-hidden">${fullInfo}</div>
        <div id="hint-${i}" style="color:#7a8ba0;font-size:0.85rem;margin-top:8px">👆 想好中文意思後,點卡片翻面</div>
      </div>
      <div id="rate-${i}" class="rate-row card-hidden">
        <button class="rate-btn forgot" onclick="rate(${i},'wrong')">😅 忘了</button>
        <button class="rate-btn hard" onclick="rate(${i},'hard')">🙂 有點難</button>
        <button class="rate-btn got" onclick="rate(${i},'right')">😎 會了</button>
      </div>
    `;
  }

  if (currentMode === 'zh2en') {
    return `
      <div style="display:flex;align-items:center;margin-bottom:6px">${num}<span style="color:#7a8ba0;font-size:0.85rem">第 ${i+1} 題</span></div>
      <div class="meaning-big">${w.meaning}</div>
      <div class="pos" style="font-size:0.85rem">${w.pos}${w.exSimpZh ? ' · 提示例句:' + w.exSimpZh : ''}</div>
      <input type="text" class="quiz-input" id="input-${i}" placeholder="輸入英文單字..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')handleEnter(${i})">
      <div class="quiz-actions">
        <button class="btn btn-check" onclick="checkSpelling(${i})">檢查</button>
        <button class="btn btn-reveal" onclick="revealAnswer(${i})">看答案</button>
      </div>
      <div class="feedback" id="fb-${i}"></div>
    `;
  }

  if (currentMode === 'listen') {
    return `
      <div style="display:flex;align-items:center;margin-bottom:6px">${num}<span style="color:#7a8ba0;font-size:0.85rem">第 ${i+1} 題</span></div>
      <div style="text-align:center;margin:10px 0">${bigAudioBtn}</div>
      <div style="text-align:center;color:#7a8ba0;font-size:0.85rem;margin-bottom:8px">聽發音,拼寫出來</div>
      <input type="text" class="quiz-input" id="input-${i}" placeholder="打字..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')handleEnter(${i})">
      <div class="quiz-actions">
        <button class="btn btn-check" onclick="checkSpelling(${i})">檢查</button>
        <button class="btn btn-reveal" onclick="revealAnswer(${i})">看答案</button>
      </div>
      <div class="feedback" id="fb-${i}"></div>
    `;
  }
}

function flipCard(i) {
  document.getElementById(`back-${i}`).classList.remove('card-hidden');
  document.getElementById(`hint-${i}`).style.display = 'none';
  document.getElementById(`rate-${i}`).classList.remove('card-hidden');
  playAudio(words[i].word);
}

function rate(i, result) {
  answered[i] = result;
  const card = document.getElementById(`card-${i}`);
  card.classList.remove('answered-right','answered-wrong');
  if (result === 'right') { card.classList.add('answered-right'); setFlag(i, false); }
  else if (result === 'wrong') { card.classList.add('answered-wrong'); setFlag(i, true); }
  else if (result === 'hard') { setFlag(i, true); }
  saveProgress();
  updateProgress();
}

function handleEnter(i) {
  const input = document.getElementById(`input-${i}`);
  if (input.classList.contains('correct')) {
    goNext();
  } else {
    checkSpelling(i);
  }
}

function checkSpelling(i) {
  const input = document.getElementById(`input-${i}`);
  const fb = document.getElementById(`fb-${i}`);
  const user = input.value.trim().toLowerCase();
  const correct = words[i].word.toLowerCase();

  if (!user) return;

  if (user === correct) {
    input.classList.remove('wrong'); input.classList.add('correct');
    fb.className = 'feedback show right';
    fb.innerHTML = `✅ 答對了!<div style="margin-top:6px">${words[i].word} ${words[i].kk} — ${words[i].pos} ${words[i].meaning}</div>`;
    answered[i] = 'right';
    setFlag(i, false);
  } else {
    input.classList.remove('correct'); input.classList.add('wrong');
    fb.className = 'feedback show wrong';
    fb.innerHTML = `❌ 差一點!你寫的:<b>${input.value}</b><br>正解:<span class="diff">${diffMark(user, correct)}</span><div style="margin-top:6px">${words[i].kk} — ${words[i].pos} ${words[i].meaning}</div>`;
    answered[i] = 'wrong';
    setFlag(i, true);
  }
  playAudio(words[i].word);
  saveProgress(); updateProgress();
}

function diffMark(user, correct) {
  let html = '';
  for (let k = 0; k < correct.length; k++) {
    if (user[k] === correct[k]) html += correct[k];
    else html += `<span class="miss">${correct[k]}</span>`;
  }
  return html;
}

function revealAnswer(i) {
  const fb = document.getElementById(`fb-${i}`);
  fb.className = 'feedback show wrong';
  fb.innerHTML = `答案:<b style="font-size:1.2rem">${words[i].word}</b> ${words[i].kk}<div>${words[i].pos} ${words[i].meaning}</div>`;
  playAudio(words[i].word);
  answered[i] = 'wrong';
  setFlag(i, true);
  saveProgress(); updateProgress();
}

function updateProgress() {
  const total = words.length;
  const done = Object.keys(answered).length;
  const right = Object.values(answered).filter(r => r === 'right').length;
  const wrong = Object.values(answered).filter(r => r === 'wrong' || r === 'hard').length;
  document.getElementById('statAnswered').textContent = done;
  document.getElementById('statRight').textContent = right;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('progressFill').style.width = (done / total * 100) + '%';
}

function saveProgress() {
  localStorage.setItem('pet-r35-' + currentMode, JSON.stringify(answered));
}

function loadProgress() {
  const saved = localStorage.getItem('pet-r35-' + currentMode);
  answered = saved ? JSON.parse(saved) : {};
}

function resetProgress() {
  if (!confirm('重置本模式的進度?')) return;
  answered = {};
  localStorage.removeItem('pet-r35-' + currentMode);
  renderCards();
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const newMode = btn.dataset.mode;
    modeIdx[currentMode] = getOrder().indexOf(currentIdx);
    currentMode = newMode;
    if (newMode !== 'study') reshuffle(newMode);
    else ensureOrder('study');
    currentIdx = modeOrder[newMode][modeIdx[newMode]] ?? modeOrder[newMode][0];
    loadProgress();
    renderCards();
  };
});

ensureOrder('study');
currentIdx = modeOrder.study[0];
loadProgress();
renderCards();
</script>
</body>
</html>
